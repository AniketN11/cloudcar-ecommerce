<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudCart</title>
<style>
  :root { --bg:#f6f8f5; --ink:#14201a; --muted:#5b6b62; --green:#1f7a4d; --green-d:#155937; --card:#ffffff; --line:#dbe3dd; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 6vw; background:var(--card); border-bottom:1px solid var(--line); }
  .logo { font-weight:800; font-size:1.3rem; color:var(--green-d); }
  .cart { font-weight:600; }
  .hero { padding:56px 6vw; background:var(--green-d); color:#fff; }
  .hero h1 { font-size:clamp(1.8rem,5vw,3rem); max-width:16ch; line-height:1.15; }
  .hero p { margin-top:12px; max-width:48ch; color:#d3eadc; }
  main { padding:40px 6vw 56px; }
  h2 { font-size:1.3rem; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; display:flex; flex-direction:column; gap:6px; }
  .item .name { font-weight:700; }
  .item .price { color:var(--muted); margin-bottom:10px; }
  button { margin-top:auto; padding:10px; border:0; border-radius:6px; background:var(--green); color:#fff; font-weight:600; cursor:pointer; }
  button:hover { background:var(--green-d); }
  button:focus-visible { outline:3px solid #8fd1ac; outline-offset:2px; }
  footer { padding:20px 6vw; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <span class="logo">CloudCart</span>
  <span class="cart">Cart (<span id="count">0</span>)</span>
</header>
<section class="hero">
  <h1>Smart shopping starts here</h1>
  <p>Laptops, audio, wearables and phones, delivered from a container built by Jenkins.</p>
</section>
<main>
  <h2>Featured products</h2>
  <div class="grid">
    <div class="item"><span class="name">Laptop</span><span class="price">₹49,999</span><button>Add to cart</button></div>
    <div class="item"><span class="name">Headphones</span><span class="price">₹2,499</span><button>Add to cart</button></div>
    <div class="item"><span class="name">Smartwatch</span><span class="price">₹3,999</span><button>Add to cart</button></div>
    <div class="item"><span class="name">Smartphone</span><span class="price">₹19,999</span><button>Add to cart</button></div>
  </div>
</main>
<footer>Deployed with Git, Jenkins, Docker and AWS EC2. Version 2</footer>
<script>
  var n = 0;
  document.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { n++; document.getElementById('count').textContent = n; });
  });
</script>
</body>
</html>
